<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaria SMP - Economy Hub</title>

    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #060214;
            background-image:
                radial-gradient(circle at 10% 10%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 30% 20%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 75% 15%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 50% 40%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 15% 70%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 85% 80%, #ffffff 4px, transparent 4px),
                radial-gradient(circle at 90% 30%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 40% 85%, #ffffff 3px, transparent 3px),
                linear-gradient(135deg, #0d0624 0%, #1a0f3c 45%, #060214 100%);
            color: #f1edfa;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* =========================
           FALLING STARS
        ========================= */

        .sky-meteor {
            position: fixed;
            height: 2px;
            background: linear-gradient(
                -45deg,
                #ffffff,
                #c084fc,
                rgba(0, 0, 0, 0)
            );
            filter: drop-shadow(0 0 6px #c084fc);
            opacity: 0;
            animation: moveMeteor 4s infinite linear;
            pointer-events: none;
            z-index: -1;
        }

        .m1 {
            top: 5%;
            right: 10%;
            width: 80px;
            animation-delay: 0s;
        }

        .m2 {
            top: 20%;
            right: 30%;
            width: 120px;
            animation-delay: 1.5s;
            animation-duration: 5s;
        }

        .m3 {
            top: 40%;
            right: 5%;
            width: 60px;
            animation-delay: 3s;
            animation-duration: 3s;
        }

        @keyframes moveMeteor {
            0% {
                transform: translate(0, 0) rotate(-45deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translate(-500px, 500px) rotate(-45deg);
                opacity: 0;
            }
        }

        /* =========================
           LANGUAGE MENU
        ========================= */

        .language-selector {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 1000;
        }

        .language-button {
            background: rgba(13, 6, 29, 0.9);
            color: white;
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }

        .language-button:hover {
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .language-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 48px;
            min-width: 155px;
            background: rgba(13, 6, 29, 0.97);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .language-menu button {
            display: block;
            width: 100%;
            padding: 10px 12px;
            background: transparent;
            border: none;
            color: white;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .language-menu button:hover {
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
        }

        /* =========================
           HEADER
        ========================= */

        .banner-title {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow:
                0 0 25px rgba(168, 85, 247, 0.9),
                0 0 50px rgba(192, 132, 252, 0.5);
            letter-spacing: 6px;
        }

        .tagline {
            color: #d8b4fe;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 45px;
            opacity: 0.85;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(13, 6, 29, 0.85);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.85),
                inset 0 0 25px rgba(168, 85, 247, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        input {
            width: 92%;
            padding: 16px;
            margin-bottom: 25px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            background: rgba(7, 3, 15, 0.95);
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.35);
        }

        /* =========================
           MARKET
        ========================= */

        .market-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(230px, 1fr)
            );
            gap: 25px;
            margin-top: 10px;
        }

        .item-card {
            background: rgba(30, 16, 61, 0.65);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 18px;
            padding: 24px;
            text-align: left;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            transition: 0.25s ease;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2);
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }

        .item-namespace {
            font-size: 0.8rem;
            color: #c084fc;
            opacity: 0.8;
            display: block;
            margin-bottom: 15px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 1.05rem;
        }

        .worth-value {
            color: #4ade80;
            font-weight: 700;
        }

        /* =========================
           ADMIN
        ========================= */

        .admin-trigger {
            margin-top: 40px;
            color: #a78bfa;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: underline;
            opacity: 0.5;
        }

        .admin-trigger:hover {
            opacity: 1;
        }

        .admin-panel {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: rgba(7, 3, 15, 0.85);
            border-radius: 14px;
            border: 1px dashed rgba(168, 85, 247, 0.5);
            text-align: left;
        }

        .admin-panel h3 {
            color: #c084fc;
            margin-top: 0;
        }

        .admin-panel label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 600;
        }

        .admin-btn {
            background: #a855f7;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .admin-btn:hover {
            background: #c084fc;
        }

        .delete-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            font-size: 1rem;
        }

        .delete-btn:hover {
            background: #f87171;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 12px;
            }

            .banner-title {
                font-size: 2.7rem;
                letter-spacing: 4px;
            }

            .container {
                padding: 25px 18px;
            }

            .market-grid {
                grid-template-columns: 1fr;
            }

            .language-selector {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- 🌠 Meteors -->
    <div class="sky-meteor m1"></div>
    <div class="sky-meteor m2"></div>
    <div class="sky-meteor m3"></div>

    <!-- 🌐 Language Selector -->
    <div class="language-selector">

        <button
            class="language-button"
            onclick="toggleLanguageMenu()"
        >
            🌐 <span id="current-language">English</span> ▾
        </button>

        <div
            class="language-menu"
            id="language-menu"
        >
            <button onclick="setLanguage('en')">
                🇬🇧 English
            </button>

            <button onclick="setLanguage('ro')">
                🇷🇴 Română
            </button>

            <button onclick="setLanguage('es')">
                🇪🇸 Español
            </button>

            <button onclick="setLanguage('fr')">
                🇫🇷 Français
            </button>

            <button onclick="setLanguage('de')">
                🇩🇪 Deutsch
            </button>
        </div>

    </div>

    <!-- 🌙 Header -->
    <div class="banner-title">
        LUNARIA
    </div>

    <div
        class="tagline"
        id="tagline"
    >
        ✦ Build • Explore • Connect ✦
    </div>

    <div class="container">

        <!-- 🔎 Search -->
        <input
            type="text"
            id="search"
            placeholder="Search item registry (e.g., Diamond)..."
            oninput="fetchPrices()"
        >

        <!-- 💎 Items -->
        <div
            class="market-grid"
            id="market-grid"
        ></div>

        <!-- ⚙️ Admin -->
        <button
            class="admin-trigger"
            id="admin-button"
            onclick="toggleAdminPanel()"
        >
            ⚙️ Access Admin Price Management
        </button>

        <div
            class="admin-panel"
            id="admin-panel"
        >

            <h3 id="admin-title">
                Update / Add Server Items
            </h3>

            <label
                id="item-id-label"
                for="admin-item-id"
            >
                Item Namespace ID:
            </label>

            <input
                type="text"
                id="admin-item-id"
                placeholder="e.g. minecraft:diamond"
            >

            <label
                id="item-name-label"
                for="admin-item-name"
            >
                Display Name:
            </label>

            <input
                type="text"
                id="admin-item-name"
                placeholder="e.g. Diamond"
            >

            <label
                id="worth-label"
                for="admin-sell"
            >
                Worth Price ($):
            </label>

            <input
                type="number"
                id="admin-sell"
                placeholder="e.g. 150"
                step="0.01"
            >

            <label
                id="password-label"
                for="admin-pass"
            >
                Secret Admin Password:
            </label>

            <input
                type="password"
                id="admin-pass"
                placeholder="Enter password..."
            >

            <button
                class="admin-btn"
                id="apply-button"
                onclick="submitPriceUpdate()"
            >
                Apply Changes to File
            </button>

            <button
                class="delete-btn"
                id="delete-button"
                onclick="submitPriceDelete()"
            >
                🗑️ Delete Item From Registry
            </button>

        </div>

    </div>

    <script>

        /* =========================
           API
        ========================= */

        const API_URL =
            "https://lunaria-prices.onrender.com";


        /* =========================
           TRANSLATIONS
        ========================= */

        const translations = {

            en: {
                name: "English",
                tagline: "✦ Build • Explore • Connect ✦",
                search:
                    "Search item registry (e.g., Diamond)...",
                admin:
                    "⚙️ Access Admin Price Management",
                adminTitle:
                    "Update / Add Server Items",
                itemId:
                    "Item Namespace ID:",
                itemName:
                    "Display Name:",
                worth:
                    "Worth Price ($):",
                password:
                    "Secret Admin Password:",
                apply:
                    "Apply Changes to File",
                delete:
                    "🗑️ Delete Item From Registry",
                worthText:
                    "Worth:",
                noItems:
                    "No items found.",
                connectionError:
                    "Unable to connect to the economy API."
            },

            ro: {
                name: "Română",
                tagline:
                    "✦ Construiește • Explorează • Conectează-te ✦",
                search:
                    "Caută în registrul obiectelor (ex. Diamond)...",
                admin:
                    "⚙️ Accesează administrarea prețurilor",
                adminTitle:
                    "Actualizează / Adaugă obiecte",
                itemId:
                    "ID Namespace al obiectului:",
                itemName:
                    "Numele afișat:",
                worth:
                    "Valoare ($):",
                password:
                    "Parola secretă de administrator:",
                apply:
                    "Aplică modificările",
                delete:
                    "🗑️ Șterge obiectul din registru",
                worthText:
                    "Valoare:",
                noItems:
                    "Nu au fost găsite obiecte.",
                connectionError:
                    "Nu s-a putut conecta la API-ul economiei."
            },

            es: {
                name: "Español",
                tagline:
                    "✦ Construye • Explora • Conecta ✦",
                search:
                    "Buscar en el registro de objetos (ej. Diamond)...",
                admin:
                    "⚙️ Administración de precios",
                adminTitle:
                    "Actualizar / Añadir objetos",
                itemId:
                    "ID Namespace del objeto:",
                itemName:
                    "Nombre mostrado:",
                worth:
                    "Valor ($):",
                password:
                    "Contraseña secreta de administrador:",
                apply:
                    "Aplicar cambios",
                delete:
                    "🗑️ Eliminar objeto del registro",
                worthText:
                    "Valor:",
                noItems:
                    "No se encontraron objetos.",
                connectionError:
                    "No se pudo conectar con la API."
            },

            fr: {
                name: "Français",
                tagline:
                    "✦ Construire • Explorer • Connecter ✦",
                search:
                    "Rechercher dans le registre (ex. Diamond)...",
                admin:
                    "⚙️ Gestion des prix",
                adminTitle:
                    "Modifier / Ajouter des objets",
                itemId:
                    "ID Namespace de l'objet :",
                itemName:
                    "Nom affiché :",
                worth:
                    "Valeur ($) :",
                password:
                    "Mot de passe administrateur :",
                apply:
                    "Appliquer les modifications",
                delete:
                    "🗑️ Supprimer l'objet du registre",
                worthText:
                    "Valeur :",
                noItems:
                    "Aucun objet trouvé.",
                connectionError:
                    "Impossible de se connecter à l'API."
            },

            de: {
                name: "Deutsch",
                tagline:
                    "✦ Bauen • Erkunden • Verbinden ✦",
                search:
                    "Objektregister durchsuchen (z. B. Diamond)...",
                admin:
                    "⚙️ Preisverwaltung öffnen",
                adminTitle:
                    "Objekte aktualisieren / hinzufügen",
                itemId:
                    "Namespace-ID des Objekts:",
                itemName:
                    "Anzeigename:",
                worth:
                    "Wert ($):",
                password:
                    "Geheimes Admin-Passwort:",
                apply:
                    "Änderungen anwenden",
                delete:
                    "🗑️ Objekt aus dem Register löschen",
                worthText:
                    "Wert:",
                noItems:
                    "Keine Objekte gefunden.",
                connectionError:
                    "Verbindung zur Economy-API fehlgeschlagen."
            }
        };


        /* =========================
           CURRENT LANGUAGE
        ========================= */

        function getCurrentLanguage() {

            return localStorage.getItem(
                "lunaria-language"
            ) || "en";
        }


        /* =========================
           LANGUAGE MENU
        ========================= */

        function toggleLanguageMenu() {

            const menu =
                document.getElementById(
                    "language-menu"
                );

            menu.style.display =
                menu.style.display === "block"
                    ? "none"
                    : "block";
        }


        /* =========================
           CHANGE LANGUAGE
        ========================= */

        function setLanguage(language) {

            const t =
                translations[language];

            if (!t) return;

            document.documentElement.lang =
                language;

            document.getElementById(
                "current-language"
            ).textContent = t.name;

            document.getElementById(
                "tagline"
            ).textContent = t.tagline;

            document.getElementById(
                "search"
            ).placeholder = t.search;

            document.getElementById(
                "admin-button"
            ).textContent = t.admin;

            document.getElementById(
                "admin-title"
            ).textContent = t.adminTitle;

            document.getElementById(
                "item-id-label"
            ).textContent = t.itemId;

            document.getElementById(
                "item-name-label"
            ).textContent = t.itemName;

            document.getElementById(
                "worth-label"
            ).textContent = t.worth;

            document.getElementById(
                "password-label"
            ).textContent = t.password;

            document.getElementById(
                "apply-button"
            ).textContent = t.apply;

            document.getElementById(
                "delete-button"
            ).textContent = t.delete;

            localStorage.setItem(
                "lunaria-language",
                language
            );

            document.getElementById(
                "language-menu"
            ).style.display = "none";

            fetchPrices();
        }


        /* =========================
           CLOSE LANGUAGE MENU
        ========================= */

        document.addEventListener(
            "click",
            function(event) {

                const selector =
                    document.querySelector(
                        ".language-selector"
                    );

                if (
                    !selector.contains(
                        event.target
                    )
                ) {

                    document.getElementById(
                        "language-menu"
                    ).style.display = "none";
                }
            }
        );


        /* =========================
           RENDER ITEM CARDS
        ========================= */

        function renderCards(items) {

            const grid =
                document.getElementById(
                    "market-grid"
                );

            grid.innerHTML = "";

            const language =
                getCurrentLanguage();

            const t =
                translations[language];

            if (
                !Array.isArray(items) ||
                items.length === 0
            ) {

                grid.innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 30px;
                        color: #c084fc;
                    ">
                        ${t.noItems}
                    </div>
                `;

                return;
            }

            items.forEach(function(item) {

                const card =
                    document.createElement("div");

                card.className =
                    "item-card";

                const itemName =
                    document.createElement("div");

                itemName.className =
                    "item-name";

                itemName.textContent =
                    item.item_name ||
                    "Unknown Item";

                const namespace =
                    document.createElement("span");

                namespace.className =
                    "item-namespace";

                namespace.textContent =
                    item.item_id ||
                    "Unknown ID";

                const worthRow =
                    document.createElement("div");

                worthRow.className =
                    "price-row";

                worthRow.innerHTML = `
                    <span>
                        ${t.worthText}
                    </span>

                    <span class="worth-value">
                        $${Number(
                            item.sell_price || 0
                        ).toFixed(2)}
                    </span>
                `;

                card.appendChild(itemName);
                card.appendChild(namespace);
                card.appendChild(worthRow);

                grid.appendChild(card);
            });
        }


        /* =========================
           FETCH PRICES
        ========================= */

        async function fetchPrices() {

            const query =
                document
                    .getElementById("search")
                    .value
                    .trim();

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices?search=" +
                        encodeURIComponent(query)
                    );

                if (!response.ok) {
                    throw new Error(
                        "API request failed"
                    );
                }

                const data =
                    await response.json();

                renderCards(data);

            } catch (err) {

                console.error(
                    "Connection issue:",
                    err
                );

                const language =
                    getCurrentLanguage();

                const t =
                    translations[language];

                document.getElementById(
                    "market-grid"
                ).innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 30px;
                        color: #f87171;
                    ">
                        ${t.connectionError}
                    </div>
                `;
            }
        }


        /* =========================
           ADMIN PANEL
        ========================= */

        function toggleAdminPanel() {

            const panel =
                document.getElementById(
                    "admin-panel"
                );

            panel.style.display =
                panel.style.display === "block"
                    ? "none"
                    : "block";
        }


        /* =========================
           UPDATE / ADD ITEM
        ========================= */

        async function submitPriceUpdate() {

            const item_id =
                document
                    .getElementById(
                        "admin-item-id"
                    )
                    .value
                    .trim();

            const item_name =
                document
                    .getElementById(
                        "admin-item-name"
                    )
                    .value
                    .trim();

            const sell_price =
                parseFloat(
                    document
                        .getElementById(
                            "admin-sell"
                        )
                        .value
                );

            const password =
                document
                    .getElementById(
                        "admin-pass"
                    )
                    .value;

            if (
                !item_id ||
                isNaN(sell_price) ||
                !password
            ) {

                alert(
                    "Please fill out all fields correctly!"
                );

                return;
            }

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices/update",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                item_id,
                                item_name,
                                sell_price,
                                password
                            })
                        }
                    );

                const result =
                    await response.json();

                alert(
                    result.message ||
                    "Price update completed."
                );

                fetchPrices();

            } catch (err) {

                console.error(err);

                alert(
                    "Error sending update."
                );
            }
        }


        /* =========================
           DELETE ITEM
        ========================= */

        async function submitPriceDelete() {

            const item_id =
                document
                    .getElementById(
                        "admin-item-id"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "admin-pass"
                    )
                    .value;

            if (
                !item_id ||
                !password
            ) {

                alert(
                    "Please provide the Item Namespace ID and Password to delete!"
                );

                return;
            }

            if (
                !confirm(
                    `Are you absolutely sure you want to delete ${item_id}?`
                )
            ) {
                return;
            }

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices/delete",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                item_id,
                                password
                            })
                        }
                    );

                const result =
                    await response.json();

                alert(
                    result.message ||
                    "Item deletion completed."
                );

                fetchPrices();

            } catch (err) {

                console.error(err);

                alert(
                    "Error running deletion."
                );
            }
        }


        /* =========================
           START
        ========================= */

        setLanguage(
            getCurrentLanguage()
        );

    </script>
