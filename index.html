<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaria SMP - Economy Hub</title>
    <style>
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, #0b071e 0%, #170d3a 50%, #0b071e 100%);
            color: #f1edfa; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌌 Star Container */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        /* ✨ Distinct Glowing Points of Light (Slower & No Lines) */
        .drifting-star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(168, 85, 247, 0.4);
            opacity: 0;
            animation: slowDrift 18s infinite linear;
        }

        /* Creating groups with different starting points and sizes */
        .ds1 { width: 4px; height: 4px; top: 10%; right: -10px; animation-delay: 0s; }
        .ds2 { width: 3px; height: 3px; top: 35%; right: -10px; animation-delay: 4.5s; }
        .ds3 { width: 5px; height: 5px; top: 60%; right: -10px; animation-delay: 9s; }
        .ds4 { width: 3px; height: 3px; top: 80%; right: -10px; animation-delay: 13.5s; }

        /* Smooth, relaxed drift across the viewport screen */
        @keyframes slowDrift {
            0% {
                transform: translateX(0) translateY(0);
                opacity: 0;
            }
            15% {
                opacity: 0.7;
            }
            85% {
                opacity: 0.7;
            }
            100% {
                transform: translateX(-115vw) translateY(45vh);
                opacity: 0;
            }
        }

        /* 🌙 The Favorite Visual Layout Elements */
        .banner-title {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.8), 0 0 40px rgba(192, 132, 252, 0.4);
            letter-spacing: 3px;
        }
        .tagline {
            color: #d8b4fe;
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: rgba(24, 15, 51, 0.65); 
            padding: 35px; 
            border-radius: 20px; 
            border: 1px solid rgba(168, 85, 247, 0.25); 
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        input, select { 
            width: 90%; 
            padding: 14px; 
            margin-bottom: 25px; 
            border-radius: 10px; 
            border: 1px solid rgba(168, 85, 247, 0.4); 
            background: rgba(15, 9, 36, 0.8); 
            color: #fff; 
            font-size: 16px; 
        }
        input:focus { border-color: #c084fc; outline: none; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 10px; }
        
        .item-card {
            background: rgba(36, 23, 74, 0.5);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 14px;
            padding: 20px;
            text-align: left;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 85, 247, 0.6);
            background: rgba(43, 27, 89, 0.7);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.2);
        }
        .item-name { font-size: 1.2rem; font-weight: bold; color: #ffffff; }
        .item-namespace { font-size: 0.75rem; color: #a78bfa; opacity: 0.6; display: block; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; margin-top: 6px; }
        .buy-value { color: #4ade80; font-weight: 700; }
        .sell-value { color: #f87171; font-weight: 700; }
        
        .admin-trigger { margin-top: 40px; color: #a78bfa; background: none; border: none; cursor: pointer; font-size: 0.9rem; text-decoration: underline; opacity: 0.5; }
        .admin-trigger:hover { opacity: 1; }
        .admin-panel { display: none; margin-top: 30px; padding: 25px; background: rgba(255, 255, 255, 0.05); border-radius: 14px; border: 1px dashed rgba(168, 85, 247, 0.4); text-align: left; }
        .admin-btn { background: #a855f7; border: none; color: white; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .admin-btn:hover { background: #c084fc; }
    </style>
</head>
<body>

    <!-- 🌌 Space Background Layers -->
    <div id="stars-container">
        <div class="drifting-star ds1"></div>
        <div class="drifting-star ds2"></div>
        <div class="drifting-star ds3"></div>
        <div class="drifting-star ds4"></div>
    </div>

    <div class="banner-title">LUNARIA</div>
    <div class="tagline">✦ Build • Explore • Connect ✦</div>
    
    <div class="container">
        <input type="text" id="search" placeholder="Search item registry (e.g., Diamond)..." oninput="fetchPrices()">
        
        <div class="market-grid" id="market-grid"></div>

        <button class="admin-trigger" onclick="toggleAdminPanel()">⚙️ Access Admin Price Management</button>
        
        <div class="admin-panel" id="admin-panel">
            <h3 style="color: #c084fc; margin-top: 0;">Update Server Item Prices</h3>
            <label>Select Item Namespace ID:</label>
            <select id="admin-item-id">
                <option value="minecraft:diamond">minecraft:diamond (Diamond)</option>
                <option value="minecraft:iron_ingot">minecraft:iron_ingot (Iron Ingot)</option>
                <option value="minecraft:netherite_ingot">minecraft:netherite_ingot (Netherite Ingot)</option>
            </select>

            <label>New Buy Price ($):</label>
            <input type="number" id="admin-buy" placeholder="e.g. 550">

            <label>New Sell Price ($):</label>
            <input type="number" id="admin-sell" placeholder="e.g. 175">

            <label>Secret Admin Password:</label>
            <input type="password" id="admin-pass" placeholder="Enter password...">

            <button class="admin-btn" onclick="submitPriceUpdate()">Apply Price Update</button>
        </div>
    </div>

<script>
    let currentData = [];
    const API_URL = "https://onrender.com"; 

    async function fetchPrices() {
        const query = document.getElementById('search').value;
        try {
            const response = await fetch(API_URL + '/api/prices?search=' + query);
            currentData = await response.json();
            const grid = document.getElementById('market-grid');
            grid.innerHTML = ''; 
            
            currentData.forEach(function(item) {
                grid.innerHTML += '<div class="item-card">' +
                    '<div class="item-name">' + item.item_name + '</div>' +
                    '<span class="item-namespace">' + item.item_id + '</span>' +
                    '<div class="price-row"><span>Buy:</span><span class="buy-value">$' + item.buy_price.toFixed(2) + '</span></div>' +
                    '<div class="price-row"><span>Sell:</span><span class="sell-value">$' + item.sell_price.toFixed(2) + '</span></div>' +
                '</div>';
            });
        } catch (err) { console.error(err); }
    }

    function toggleAdminPanel() {
        const panel = document.getElementById('admin-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    async function submitPriceUpdate() {
        const item_id = document.getElementById('admin-item-id').value;
        const buy_price = parseFloat(document.getElementById('admin-buy').value);
        const sell_price = parseFloat(document.getElementById('admin-sell').value);
        const password = document.getElementById('admin-pass').value;

        if (isNaN(buy_price) || isNaN(sell_price) || !password) {
            alert("Please fill out all admin fields with valid numbers!");
            return;
        }

        try {
            const response = await fetch(API_URL + '/api/prices/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    item_id: item_id, 
                    buy_price: buy_price, 
                    sell_price: sell_price, 
                    password: password 
                })
            });

            const result = await response.json();
            alert(result.message);
            if (response.ok) {
                fetchPrices();
            }
        } catch (err) {
            alert("Could not connect to the database.");
        }
    }

    fetchPrices();
</script>
</body>
</html>
