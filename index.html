<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaria SMP - Economy Hub</title>
    <style>
        /* 🌌 Deep Purple Space Gradient & Pure CSS Background Stars */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: #060214;
            /* Layered radial gradients create permanent sharp stars in the sky background texture */
            background-image: 
                radial-gradient(circle at 10% 10%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 30% 20%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 75% 15%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 50% 40%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 15% 70%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 85% 80%, #ffffff 4px, transparent 4px),
                radial-gradient(circle at 90% 30%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 40% 85%, #ffffff 3px, transparent 3px),
                linear-gradient(135deg, #0d0624 0%, #1a0f3c 45%, #060214 100%);
            color: #f1edfa; 
            text-align: center; 
            padding: 60px 20px; 
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌠 Pure CSS Falling Stars (No Code Needed to Run!) */
        .sky-meteor {
            position: fixed;
            height: 2px;
            background: linear-gradient(-45deg, #ffffff, #c084fc, rgba(0, 0, 0, 0));
            filter: drop-shadow(0 0 6px #c084fc);
            opacity: 0;
            animation: moveMeteor 4s infinite linear;
            pointer-events: none;
            z-index: -1;
        }

        /* Fast and slow falling paths distributed across the screen */
        .m1 { top: 5%;  right: 10%; width: 80px;  animation-delay: 0s; }
        .m2 { top: 20%; right: 30%; width: 120px; animation-delay: 1.5s; animation-duration: 5s; }
        .m3 { top: 40%; right: 5%;  width: 60px;  animation-delay: 3s; animation-duration: 3s; }

        @keyframes moveMeteor {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translate(-500px, 500px) rotate(-45deg); opacity: 0; }
        }

        .banner-title {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.9), 0 0 50px rgba(192, 132, 252, 0.5);
            letter-spacing: 6px;
        }
        .tagline {
            color: #d8b4fe;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 45px;
            opacity: 0.85;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: rgba(13, 6, 29, 0.85); 
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(168, 85, 247, 0.4); 
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 0 25px rgba(168, 85, 247, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        input, select { 
            width: 92%; 
            padding: 16px; 
            margin-bottom: 25px; 
            border-radius: 12px; 
            border: 1px solid rgba(168, 85, 247, 0.5); 
            background: rgba(7, 3, 15, 0.95); 
            color: #fff; 
            font-size: 16px; 
        }

        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 25px; margin-top: 10px; }
        
        .item-card {
            background: rgba(30, 16, 61, 0.65);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 18px;
            padding: 24px;
            text-align: left;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }

        .item-name { font-size: 1.3rem; font-weight: bold; color: #ffffff; }
        .item-namespace { font-size: 0.8rem; color: #c084fc; opacity: 0.8; display: block; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 1.05rem; }
        .buy-value { color: #4ade80; font-weight: 700; }
        .sell-value { color: #f87171; font-weight: 700; }
        
        .admin-trigger { margin-top: 40px; color: #a78bfa; background: none; border: none; cursor: pointer; font-size: 0.95rem; text-decoration: underline; opacity: 0.5; }
        .admin-trigger:hover { opacity: 1; }
        .admin-panel { display: none; margin-top: 30px; padding: 25px; background: rgba(7, 3, 15, 0.85); border-radius: 14px; border: 1px dashed rgba(168, 85, 247, 0.5); text-align: left; }
        .admin-btn { background: #a855f7; border: none; color: white; padding: 14px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; font-size: 1rem; }
        .admin-btn:hover { background: #c084fc; }
    </style>
</head>
<body>

    <!-- Falling Meteor Elements -->
    <div class="sky-meteor m1"></div>
    <div class="sky-meteor m2"></div>
    <div class="sky-meteor m3"></div>

    <div class="banner-title">LUNARIA</div>
    <div class="tagline">✦ Build • Explore • Connect ✦</div>
    
    <div class="container">
        <input type="text" id="search" placeholder="Search item registry (e.g., Diamond)..." oninput="fetchPrices()">
        
        <!-- The item grid where our cards display -->
        <div class="market-grid" id="market-grid"></div>

        <button class="admin-trigger" onclick="toggleAdminPanel()">⚙️ Access Admin Price Management</button>
        
        <div class="admin-panel" id="admin-panel">
            <h3 style="color: #c084fc; margin-top: 0;">Update Server Item Prices</h3>
            <label>Select Item Namespace ID:</label>
            <select id="admin-item-id">
                <option value="minecraft:diamond">minecraft:diamond (Diamond)</option>
                <option value="minecraft:iron_ingot">minecraft:iron_ingot (Iron Ingot)</option>
                <option value="minecraft:netherite_ingot">minecraft:netherite_ingot (Netherite Ingot)</option>
            </select>

            <label>New Buy Price ($):</label>
            <input type="number" id="admin-buy" placeholder="e.g. 550">

            <label>New Sell Price ($):</label>
            <input type="number" id="admin-sell" placeholder="e.g. 175">

            <label>Secret Admin Password:</label>
            <input type="password" id="admin-pass" placeholder="Enter password...">

            <button class="admin-btn" onclick="submitPriceUpdate()">Apply Price Update</button>
        </div>
    </div>

<script>
    // Hardcoded static backup data. If the server fails, it forces these to load right away!
    const fallbackData = [
        { item_id: 'minecraft:diamond', item_name: 'Diamond', buy_price: 500.00, sell_price: 150.00 },
        { item_id: 'minecraft:iron_ingot', item_name: 'Iron Ingot', buy_price: 50.00, sell_price: 15.00 },
        { item_id: 'minecraft:netherite_ingot', item_name: 'Netherite Ingot', buy_price: 5000.00, sell_price: 2000.00 }
    ];

    const API_URL = "https://onrender.com"; 

    function renderCards(items) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = ''; 
        items.forEach(function(item) {
            grid.innerHTML += '<div class="item-card">' +
                '<div class="item-name">' + item.item_name + '</div>' +
                '<span class="item-namespace">' + item.item_id + '</span>' +
                '<div class="price-row"><span>Buy:</span><span class="buy-value">$' + item.buy_price.toFixed(2) + '</span></div>' +
                '<div class="price-row"><span>Sell:</span><span class="sell-value">$' + item.sell_price.toFixed(2) + '</span></div>' +
            '</div>';
        });
    }

    async function fetchPrices() {
        const query = document.getElementById('search').value;
        try {
            const response = await fetch(API_URL + '/api/prices?search=' + query);
            const data = await response.json();
            if (data && data.length > 0) {
                renderCards(data);
            } else {
                renderCards(fallbackData);
            }
        } catch (err) { 
            console.log("Using backup visual mode.");
            renderCards(fallbackData); 
        }
    }

    function toggleAdminPanel() {
        const panel = document.getElementById('admin-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    async function submitPriceUpdate() {
        const item_id = document.getElementById('admin-item-id').value;
        const buy_price = parseFloat(document.getElementById('admin-buy').value);
        const sell_price = parseFloat(document.getElementById('admin-sell').value);
        const password = document.getElementById('admin-pass').value;

        if (isNaN(buy_price) || isNaN(sell_price) || !password) {
            alert("Please fill out all fields!");
            return;
        }

        try {
            const response = await fetch(API_URL + '/api/prices/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_id, buy_price, sell_price, password })
            });
            const result = await response.json();
            alert(result.message);
            fetchPrices();
        } catch (err) {
            alert("Error sending update.");
        } Force cards to populate instantly on loadfetchPrices();
