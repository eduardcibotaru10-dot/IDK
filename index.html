<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaria SMP - Economy Hub</title>
    <style>
        /* 🌌 Deep Magical Night Sky Layering */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: radial-gradient(circle at 50% 30%, #1e1145 0%, #0d0624 60%, #050212 100%);
            color: #f1edfa; 
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌙 Background Star Layer Containers */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        /* ✨ Sharp Four-Pointed Sparkle Stars (Matches the Banner!) */
        .sparkle-star {
            position: absolute;
            background: #ffffff;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px #a855f7;
            animation: pulseTwinkle var(--duration) infinite ease-in-out;
            pointer-events: none;
        }

        /* CSS pseudo-elements build the cross-beams for the 4-pointed stars */
        .sparkle-star::before, .sparkle-star::after {
            content: '';
            position: absolute;
            background: linear-gradient(to right, transparent, #ffffff, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* Horizontal glow line */
        .sparkle-star::before {
            width: var(--star-width);
            height: 1px;
        }
        /* Vertical glow line */
        .sparkle-star::after {
            width: 1px;
            height: var(--star-height);
        }

        @keyframes pulseTwinkle {
            0%, 100% { transform: scale(0.3); opacity: 0.2; }
            50% { transform: scale(1); opacity: 1; }
        }

        /* 🌠 Slower Group Drifting Shooting Stars with Subtle Tails */
        .shooting-star {
            position: fixed;
            top: var(--start-y);
            left: var(--start-x);
            height: 2px;
            background: linear-gradient(-45deg, rgba(255, 255, 255, 0.9), rgba(168, 85, 247, 0.4), rgba(0, 0, 0, 0));
            filter: drop-shadow(0 0 4px #c084fc);
            animation: slowShoot var(--duration) ease-in-out forwards;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes slowShoot {
            0% {
                width: 0;
                transform: translateX(0) translateY(0) rotate(-45deg);
                opacity: 0;
            }
            15% {
                width: 70px;
                opacity: 0.8;
            }
            100% {
                width: 0;
                transform: translate(var(--travel-x), var(--travel-y)) rotate(-45deg);
                opacity: 0;
            }
        }

        /* ✨ Premium Banner Font & Neon Effects */
        .banner-title {
            font-size: 3.8rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.8), 0 0 50px rgba(192, 132, 252, 0.4);
            letter-spacing: 5px;
        }
        .tagline {
            color: #d8b4fe;
            font-size: 0.85rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 45px;
            opacity: 0.8;
        }

        /* 🏰 Floating Glass App Container Window */
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: rgba(18, 10, 38, 0.7); 
            padding: 35px; 
            border-radius: 24px; 
            border: 1px solid rgba(168, 85, 247, 0.35); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(168, 85, 247, 0.1);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            animation: floatingFloat 6s ease-in-out infinite;
        }

        @keyframes floatingFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Input Controls Panels styling */
        input, select { 
            width: 90%; 
            padding: 16px; 
            margin-bottom: 25px; 
            border-radius: 12px; 
            border: 1px solid rgba(168, 85, 247, 0.4); 
            background: rgba(11, 5, 26, 0.9); 
            color: #fff; 
            font-size: 16px; 
            transition: all 0.3s ease;
        }
        input:focus { 
            border-color: #c084fc; 
            outline: none; 
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); 
        }

        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 10px; }
        
        /* Magical Glowing Cards */
        .item-card {
            background: rgba(33, 19, 66, 0.45);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 16px;
            padding: 22px;
            text-align: left;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .item-card:hover {
            transform: scale(1.02);
            border-color: rgba(168, 85, 247, 0.7);
            background: rgba(43, 23, 87, 0.6);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
        }

        .item-name { font-size: 1.25rem; font-weight: bold; color: #ffffff; }
        .item-namespace { font-size: 0.75rem; color: #c084fc; opacity: 0.7; display: block; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; margin-top: 6px; }
        .buy-value { color: #4ade80; font-weight: 700; text-shadow: 0 0 8px rgba(74, 222, 128, 0.3); }
        .sell-value { color: #f87171; font-weight: 700; text-shadow: 0 0 8px rgba(248, 113, 113, 0.3); }
        
        .admin-trigger { margin-top: 40px; color: #a78bfa; background: none; border: none; cursor: pointer; font-size: 0.9rem; text-decoration: underline; opacity: 0.5; }
        .admin-trigger:hover { opacity: 1; }
        .admin-panel { display: none; margin-top: 30px; padding: 25px; background: rgba(11, 5, 26, 0.6); border-radius: 14px; border: 1px dashed rgba(168, 85, 247, 0.4); text-align: left; }
        .admin-btn { background: #a855f7; border: none; color: white; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .admin-btn:hover { background: #c084fc; box-shadow: 0 0 15px #a855f7; }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div class="banner-title">LUNARIA</div>
    <div class="tagline">✦ Build • Explore • Connect ✦</div>
    
    <div class="container">
        <input type="text" id="search" placeholder="Search item registry (e.g., Diamond)..." oninput="fetchPrices()">
        
        <div class="market-grid" id="market-grid"></div>

        <button class="admin-trigger" onclick="toggleAdminPanel()">⚙️ Access Admin Price Management</button>
        
        <div class="admin-panel" id="admin-panel">
            <h3 style="color: #c084fc; margin-top: 0;">Update Server Item Prices</h3>
            <label>Select Item Namespace ID:</label>
            <select id="admin-item-id">
                <option value="minecraft:diamond">minecraft:diamond (Diamond)</option>
                <option value="minecraft:iron_ingot">minecraft:iron_ingot (Iron Ingot)</option>
                <option value="minecraft:netherite_ingot">minecraft:netherite_ingot (Netherite Ingot)</option>
            </select>

            <label>New Buy Price ($):</label>
            <input type="number" id="admin-buy" placeholder="e.g. 550">

            <label>New Sell Price ($):</label>
            <input type="number" id="admin-sell" placeholder="e.g. 175">

            <label>Secret Admin Password:</label>
            <input type="password" id="admin-pass" placeholder="Enter password...">

            <button class="admin-btn" onclick="submitPriceUpdate()">Apply Price Update</button>
        </div>
    </div>

<script>
    let currentData = [];
    const API_URL = "https://onrender.com"; 

    // Generate Background Sparkle Cross Stars dynamically
    function generatePremiumSky() {
        const container = document.getElementById('stars-container');
        if(!container) return;
        const totalStars = 70; // High quality counts

        for (let i = 0; i < totalStars; i++) {
            const star = document.createElement('div');
            star.classList.add('sparkle-star');
            
            // Random positioning, sizes, and cross flare extensions
            const flareSize = Math.random() * 14 + 6; 
            star.style.top = (Math.random() * 100) + '%';
            star.style.left = (Math.random() * 100) + '%';
            star.style.setProperty('--duration', (Math.random() * 4 + 3) + 's');
            star.style.setProperty('--star-width', flareSize + 'px');
            star.style.setProperty('--star-height', flareSize + 'px');
            
            container.appendChild(star);
        }
    }

    // Spawn natural moving group stars from the right side corner panel
    function spawnDriftingStar() {
        const star = document.createElement('div');
        star.classList.add('shooting-star');

        const startX = Math.random() * window.innerWidth;
        const startY = Math.random() * (window.innerHeight / 2.5); // strictly upper canvas
        const duration = Math.random() * 3 + 3; // Soft, relaxed speeds (3 to 6 seconds)

        star.style.setProperty('--start-x', startX + 'px');
