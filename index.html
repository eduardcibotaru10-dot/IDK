<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunaria SMP - Economy Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #060214;

            background-image:
                radial-gradient(circle at 10% 10%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 30% 20%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 75% 15%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 50% 40%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 15% 70%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 85% 80%, #ffffff 4px, transparent 4px),
                radial-gradient(circle at 90% 30%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 40% 85%, #ffffff 3px, transparent 3px),
                linear-gradient(135deg, #0d0624 0%, #1a0f3c 45%, #060214 100%);

            color: #f1edfa;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* =========================
           METEORS
        ========================= */

        .sky-meteor {
            position: fixed;
            height: 2px;
            background: linear-gradient(
                -45deg,
                #ffffff,
                #c084fc,
                rgba(0, 0, 0, 0)
            );

            filter: drop-shadow(0 0 6px #c084fc);
            opacity: 0;
            animation: moveMeteor 4s infinite linear;
            pointer-events: none;
            z-index: -1;
        }

        .m1 {
            top: 5%;
            right: 10%;
            width: 80px;
        }

        .m2 {
            top: 20%;
            right: 30%;
            width: 120px;
            animation-delay: 1.5s;
            animation-duration: 5s;
        }

        .m3 {
            top: 40%;
            right: 5%;
            width: 60px;
            animation-delay: 3s;
            animation-duration: 3s;
        }

        @keyframes moveMeteor {
            0% {
                transform: translate(0, 0) rotate(-45deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translate(-500px, 500px) rotate(-45deg);
                opacity: 0;
            }
        }

        /* =========================
           LANGUAGE MENU
        ========================= */

        .language-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .language-button {
            background: rgba(13, 6, 29, 0.9);
            color: white;
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 10px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .language-button:hover {
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .language-options {
            display: none;
            margin-top: 8px;
            background: rgba(13, 6, 29, 0.97);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 10px;
            overflow: hidden;
            min-width: 130px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .language-options button {
            width: 100%;
            padding: 11px;
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            text-align: left;
        }

        .language-options button:hover {
            background: rgba(168, 85, 247, 0.25);
        }

        /* =========================
           HEADER
        ========================= */

        .banner-title {
            font-size: 4rem;
            font-weight: 900;
            color: white;
            margin-bottom: 2px;

            text-shadow:
                0 0 25px rgba(168, 85, 247, 0.9),
                0 0 50px rgba(192, 132, 252, 0.5);

            letter-spacing: 6px;
        }

        .tagline {
            color: #d8b4fe;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 45px;
            opacity: 0.85;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 900px;
            margin: 0 auto;

            background: rgba(13, 6, 29, 0.85);

            padding: 40px;
            border-radius: 24px;

            border: 1px solid rgba(168, 85, 247, 0.4);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.85),
                inset 0 0 25px rgba(168, 85, 247, 0.15);

            backdrop-filter: blur(16px);
        }

        /* =========================
           SEARCH
        ========================= */

        #search {
            width: 92%;
            padding: 16px;

            margin-bottom: 25px;

            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.5);

            background: rgba(7, 3, 15, 0.95);

            color: white;
            font-size: 16px;
        }

        #search:focus {
            outline: none;
            border-color: #c084fc;

            box-shadow:
                0 0 12px rgba(168, 85, 247, 0.35);
        }

        /* =========================
           MARKET
        ========================= */

        .market-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(230px, 1fr));

            gap: 25px;
            margin-top: 10px;
        }

        .item-card {
            background: rgba(30, 16, 61, 0.65);

            border: 1px solid rgba(168, 85, 247, 0.25);

            border-radius: 18px;

            padding: 20px;

            text-align: left;

            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.5);

            transition: 0.25s ease;

            overflow: hidden;
        }

        .item-card:hover {
            transform: translateY(-5px);

            border-color:
                rgba(192, 132, 252, 0.7);

            box-shadow:
                0 10px 30px rgba(168, 85, 247, 0.25);
        }

        /* =========================
           MINECRAFT IMAGE
        ========================= */

        .item-image {
            width: 90px;
            height: 90px;

            display: block;

            margin: 0 auto 15px auto;

            object-fit: contain;

            image-rendering: pixelated;

            filter:
                drop-shadow(
                    0 5px 8px rgba(0,0,0,0.65)
                );
        }

        .item-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
        }

        .item-namespace {
            font-size: 0.8rem;

            color: #c084fc;

            opacity: 0.8;

            display: block;

            margin-bottom: 15px;
        }

        .price-row {
            display: flex;

            justify-content: space-between;

            margin-top: 8px;

            font-size: 1.05rem;
        }

        .worth-value {
            color: #4ade80;
            font-weight: 700;
        }

        /* =========================
           ADMIN
        ========================= */

        .admin-trigger {
            margin-top: 40px;

            color: #a78bfa;

            background: none;

            border: none;

            cursor: pointer;

            font-size: 0.95rem;

            text-decoration: underline;

            opacity: 0.5;
        }

        .admin-trigger:hover {
            opacity: 1;
        }

        .admin-panel {
            display: none;

            margin-top: 30px;

            padding: 25px;

            background:
                rgba(7, 3, 15, 0.85);

            border-radius: 14px;

            border:
                1px dashed rgba(168, 85, 247, 0.5);

            text-align: left;
        }

        .admin-panel h3 {
            color: #c084fc;
            margin-top: 0;
        }

        .admin-panel label {
            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-weight: 600;
        }

        .admin-panel input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border-radius: 10px;

            border:
                1px solid rgba(168, 85, 247, 0.5);

            background:
                rgba(7, 3, 15, 0.95);

            color: white;

            font-size: 15px;
        }

        .admin-panel input:focus {
            outline: none;

            border-color: #c084fc;
        }

        .admin-btn,
        .delete-btn {
            border: none;

            color: white;

            padding: 12px 25px;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

            width: 100%;

            transition: 0.3s;

            font-size: 1rem;
        }

        .admin-btn {
            background: #a855f7;
            margin-bottom: 15px;
        }

        .admin-btn:hover {
            background: #c084fc;
        }

        .delete-btn {
            background: #ef4444;
        }

        .delete-btn:hover {
            background: #f87171;

            box-shadow:
                0 0 15px rgba(239, 68, 68, 0.4);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 12px;
            }

            .banner-title {
                font-size: 2.7rem;
                letter-spacing: 4px;
            }

            .container {
                padding: 25px 18px;
            }

            .market-grid {
                grid-template-columns: 1fr;
            }

            .language-menu {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- METEORS -->

    <div class="sky-meteor m1"></div>
    <div class="sky-meteor m2"></div>
    <div class="sky-meteor m3"></div>


    <!-- LANGUAGE MENU -->

    <div class="language-menu">

        <button
            class="language-button"
            onclick="toggleLanguages()"
        >
            🌐 <span id="language-current">English</span>
        </button>

        <div
            class="language-options"
            id="language-options"
        >

            <button onclick="setLanguage('en')">
                🇬🇧 English
            </button>

            <button onclick="setLanguage('ro')">
                🇷🇴 Română
            </button>

        </div>

    </div>


    <!-- HEADER -->

    <div class="banner-title">
        LUNARIA
    </div>

    <div
        class="tagline"
        id="tagline"
    >
        ✦ Build • Explore • Connect ✦
    </div>


    <!-- MAIN -->

    <div class="container">

        <!-- SEARCH -->

        <input
            type="text"
            id="search"
            placeholder="Search item registry (e.g., Diamond)..."
            oninput="fetchPrices()"
        >


        <!-- ITEMS -->

        <div
            class="market-grid"
            id="market-grid"
        ></div>


        <!-- ADMIN BUTTON -->

        <button
            class="admin-trigger"
            id="admin-trigger"
            onclick="toggleAdminPanel()"
        >
            ⚙️ Access Admin Price Management
        </button>


        <!-- ADMIN PANEL -->

        <div
            class="admin-panel"
            id="admin-panel"
        >

            <h3 id="admin-title">
                Update / Add Server Items
            </h3>


            <label for="admin-item-id">
                Item Namespace ID:
            </label>

            <input
                type="text"
                id="admin-item-id"
                placeholder="e.g. minecraft:diamond"
            >


            <label for="admin-item-name">
                Display Name:
            </label>

            <input
                type="text"
                id="admin-item-name"
                placeholder="e.g. Diamond"
            >


            <label for="admin-sell">
                Worth Price ($):
            </label>

            <input
                type="number"
                id="admin-sell"
                placeholder="e.g. 150"
                step="0.01"
            >


            <label for="admin-pass">
                Secret Admin Password:
            </label>

            <input
                type="password"
                id="admin-pass"
                placeholder="Enter password..."
            >


            <button
                class="admin-btn"
                id="admin-update"
                onclick="submitPriceUpdate()"
            >
                Apply Changes
            </button>


            <button
                class="delete-btn"
                id="admin-delete"
                onclick="submitPriceDelete()"
            >
                🗑️ Delete Item From Registry
            </button>

        </div>

    </div>


    <script>

        /* ======================================
           API
        ====================================== */

        const API_URL =
            "https://lunaria-prices.onrender.com";


        /* ======================================
           LANGUAGES
        ====================================== */

        let currentLanguage =
            localStorage.getItem("lunaria-language") || "en";


        const translations = {

            en: {

                language: "English",

                tagline:
                    "✦ Build • Explore • Connect ✦",

                search:
                    "Search item registry (e.g., Diamond)...",

                noItems:
                    "No items found.",

                connectionError:
                    "Unable to connect to the economy API.",

                worth:
                    "Worth:",

                admin:
                    "⚙️ Access Admin Price Management",

                adminTitle:
                    "Update / Add Server Items",

                namespace:
                    "Item Namespace ID:",

                displayName:
                    "Display Name:",

                worthPrice:
                    "Worth Price ($):",

                password:
                    "Secret Admin Password:",

                passwordPlaceholder:
                    "Enter password...",

                update:
                    "Apply Changes",

                delete:
                    "🗑️ Delete Item From Registry",

                itemIdPlaceholder:
                    "e.g. minecraft:diamond",

                itemNamePlaceholder:
                    "e.g. Diamond",

                worthPlaceholder:
                    "e.g. 150",

                fillFields:
                    "Please fill out all fields correctly!",

                invalidPassword:
                    "❌ Invalid Admin Password Access Denied!",

                updateSuccess:
                    "🎯 Worth price successfully updated!",

                updateError:
                    "Error sending update.",

                deleteConfirm:
                    "Are you absolutely sure you want to delete",

                deleteSuccess:
                    "Item deletion completed.",

                deleteError:
                    "Error running deletion."

            },


            ro: {

                language: "Română",

                tagline:
                    "✦ Construiește • Explorează • Conectează-te ✦",

                search:
                    "Caută un item (ex. Diamond)...",

                noItems:
                    "Nu au fost găsite iteme.",

                connectionError:
                    "Nu se poate conecta la API-ul economiei.",

                worth:
                    "Valoare:",

                admin:
                    "⚙️ Accesează gestionarea prețurilor",

                adminTitle:
                    "Actualizează / Adaugă iteme",

                namespace:
                    "ID Namespace al itemului:",

                displayName:
                    "Numele afișat:",

                worthPrice:
                    "Preț valoare ($):",

                password:
                    "Parola secretă de admin:",

                passwordPlaceholder:
                    "Introdu parola...",

                update:
                    "Aplică modificările",

                delete:
                    "🗑️ Șterge itemul din registru",

                itemIdPlaceholder:
                    "ex. minecraft:diamond",

                itemNamePlaceholder:
                    "ex. Diamond",

                worthPlaceholder:
                    "ex. 150",

                fillFields:
                    "Completează corect toate câmpurile!",

                invalidPassword:
                    "❌ Parolă de admin invalidă! Acces respins!",

                updateSuccess:
                    "🎯 Valoarea a fost actualizată!",

                updateError:
                    "Eroare la trimiterea modificării.",

                deleteConfirm:
                    "Ești absolut sigur că vrei să ștergi",

                deleteSuccess:
                    "Itemul a fost șters.",

                deleteError:
                    "Eroare la ștergerea itemului."

            }

        };


        function t(key) {

            return translations[currentLanguage][key];

        }


        function toggleLanguages() {

            const menu =
                document.getElementById(
                    "language-options"
                );

            menu.style.display =
                menu.style.display === "block"
                    ? "none"
                    : "block";
        }


        function setLanguage(language) {

            currentLanguage = language;

            localStorage.setItem(
                "lunaria-language",
                language
            );

            updateLanguage();

            document.getElementById(
                "language-options"
            ).style.display = "none";

            fetchPrices();
        }


        function updateLanguage() {

            document.getElementById(
                "language-current"
            ).textContent = t("language");


            document.getElementById(
                "tagline"
            ).textContent = t("tagline");


            document.getElementById(
                "search"
            ).placeholder = t("search");


            document.getElementById(
                "admin-trigger"
            ).textContent = t("admin");


            document.getElementById(
                "admin-title"
            ).textContent = t("adminTitle");


            document.querySelector(
                'label[for="admin-item-id"]'
            ).textContent = t("namespace");


            document.querySelector(
                'label[for="admin-item-name"]'
            ).textContent = t("displayName");


            document.querySelector(
                'label[for="admin-sell"]'
            ).textContent = t("worthPrice");


            document.querySelector(
                'label[for="admin-pass"]'
            ).textContent = t("password");


            document.getElementById(
                "admin-pass"
            ).placeholder =
                t("passwordPlaceholder");


            document.getElementById(
                "admin-update"
            ).textContent = t("update");


            document.getElementById(
                "admin-delete"
            ).textContent = t("delete");


            document.getElementById(
                "admin-item-id"
            ).placeholder =
                t("itemIdPlaceholder");


            document.getElementById(
                "admin-item-name"
            ).placeholder =
                t("itemNamePlaceholder");


            document.getElementById(
                "admin-sell"
            ).placeholder =
                t("worthPlaceholder");

        }


        /* ======================================
           IMAGE SYSTEM
        ====================================== */

        function getTextureURL(itemId) {

            const name =
                itemId
                    .replace("minecraft:", "")
                    .toLowerCase();

            return (
                "https://mcasset.cloud/26.1/assets/" +
                "minecraft/textures/block/" +
                name +
                ".png"
            );

        }


        /* ======================================
           RENDER ITEMS
        ====================================== */

        function renderCards(items) {

            const grid =
                document.getElementById(
                    "market-grid"
                );

            grid.innerHTML = "";


            if (
                !Array.isArray(items) ||
                items.length === 0
            ) {

                grid.innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 30px;
                        color: #c084fc;
                    ">
                        ${t("noItems")}
                    </div>
                `;

                return;
            }


            items.forEach(function(item) {

                const card =
                    document.createElement("div");

                card.className =
                    "item-card";


                /* IMAGE */

                const image =
                    document.createElement("img");

                image.className =
                    "item-image";

                image.src =
                    getTextureURL(item.item_id);

                image.alt =
                    item.item_name ||
                    "Minecraft item";


                /*
                    If the texture doesn't exist,
                    hide the broken image.
                */

                image.onerror = function() {

                    this.style.display =
                        "none";

                };


                /* NAME */

                const name =
                    document.createElement("div");

                name.className =
                    "item-name";

                name.textContent =
                    item.item_name ||
                    "Unknown Item";


                /* ID */

                const id =
                    document.createElement("span");

                id.className =
                    "item-namespace";

                id.textContent =
                    item.item_id ||
                    "Unknown ID";


                /* WORTH */

                const worth =
                    document.createElement("div");

                worth.className =
                    "price-row";

                worth.innerHTML = `
                    <span>
                        ${t("worth")}
                    </span>

                    <span class="worth-value">
                        $${Number(
                            item.sell_price || 0
                        ).toFixed(2)}
                    </span>
                `;


                card.appendChild(image);

                card.appendChild(name);

                card.appendChild(id);

                card.appendChild(worth);


                grid.appendChild(card);

            });

        }


        /* ======================================
           FETCH PRICES
        ====================================== */

        async function fetchPrices() {

            const query =
                document
                    .getElementById("search")
                    .value
                    .trim();


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices?search=" +
                        encodeURIComponent(query)
                    );


                if (!response.ok) {

                    throw new Error(
                        "API request failed"
                    );

                }


                const data =
                    await response.json();


                renderCards(data);


            } catch (err) {

                console.error(err);


                document.getElementById(
                    "market-grid"
                ).innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 30px;
                        color: #f87171;
                    ">
                        ${t("connectionError")}
                    </div>
                `;

            }

        }


        /* ======================================
           ADMIN PANEL
        ====================================== */

        function toggleAdminPanel() {

            const panel =
                document.getElementById(
                    "admin-panel"
                );


            panel.style.display =
                panel.style.display === "block"
                    ? "none"
                    : "block";

        }


        /* ======================================
           UPDATE ITEM
        ====================================== */

        async function submitPriceUpdate() {

            const item_id =
                document
                    .getElementById(
                        "admin-item-id"
                    )
                    .value
                    .trim();


            const item_name =
                document
                    .getElementById(
                        "admin-item-name"
                    )
                    .value
                    .trim();


            const sell_price =
                parseFloat(
                    document
                        .getElementById(
                            "admin-sell"
                        )
                        .value
                );


            const password =
                document
                    .getElementById(
                        "admin-pass"
                    )
                    .value;


            if (
                !item_id ||
                isNaN(sell_price) ||
                !password
            ) {

                alert(
                    t("fillFields")
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices/update",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    item_id,
                                    item_name,
                                    sell_price,
                                    password
                                })
                        }
                    );


                const result =
                    await response.json();


                alert(
                    result.message ||
                    t("updateSuccess")
                );


                fetchPrices();


            } catch (err) {

                console.error(err);

                alert(
                    t("updateError")
                );

            }

        }


        /* ======================================
           DELETE ITEM
        ====================================== */

        async function submitPriceDelete() {

            const item_id =
                document
                    .getElementById(
                        "admin-item-id"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "admin-pass"
                    )
                    .value;


            if (!item_id || !password) {

                alert(
                    t("fillFields")
                );

                return;

            }


            if (
                !confirm(
                    `${t("deleteConfirm")} ${item_id}?`
                )
            ) {

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices/delete",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    item_id,
                                    password
                                })
                        }
                    );


                const result =
                    await response.json();


                alert(
                    result.message ||
                    t("deleteSuccess")
                );


                fetchPrices();


            } catch (err) {

                console.error(err);

                alert(
                    t("deleteError")
                );

            }

        }


        /* ======================================
           START
        ====================================== */

        updateLanguage();

        fetchPrices();

    </script>

</body>
</html>
