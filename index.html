<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaria SMP - Economy Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #060214;
            background-image:
                radial-gradient(circle at 10% 10%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 30% 20%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 75% 15%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 50% 40%, #ffffff 3px, transparent 3px),
                radial-gradient(circle at 15% 70%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 85% 80%, #ffffff 4px, transparent 4px),
                radial-gradient(circle at 90% 30%, #ffffff 2px, transparent 2px),
                radial-gradient(circle at 40% 85%, #ffffff 3px, transparent 3px),
                linear-gradient(135deg, #0d0624 0%, #1a0f3c 45%, #060214 100%);
            color: #f1edfa;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* LANGUAGE MENU */
        .language-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .language-button {
            background: rgba(13, 6, 29, 0.9);
            color: white;
            border: 1px solid rgba(168, 85, 247, 0.5);
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            backdrop-filter: blur(10px);
        }

        .language-button:hover {
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .language-menu {
            display: none;
            margin-top: 8px;
            background: rgba(13, 6, 29, 0.97);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 12px;
            overflow: hidden;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .language-menu button {
            width: 100%;
            padding: 11px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }

        .language-menu button:hover {
            background: rgba(168, 85, 247, 0.25);
        }

        /* METEORS */

        .sky-meteor {
            position: fixed;
            height: 2px;
            background: linear-gradient(
                -45deg,
                #ffffff,
                #c084fc,
                rgba(0, 0, 0, 0)
            );
            filter: drop-shadow(0 0 6px #c084fc);
            opacity: 0;
            animation: moveMeteor 4s infinite linear;
            pointer-events: none;
            z-index: -1;
        }

        .m1 {
            top: 5%;
            right: 10%;
            width: 80px;
        }

        .m2 {
            top: 20%;
            right: 30%;
            width: 120px;
            animation-delay: 1.5s;
            animation-duration: 5s;
        }

        .m3 {
            top: 40%;
            right: 5%;
            width: 60px;
            animation-delay: 3s;
            animation-duration: 3s;
        }

        @keyframes moveMeteor {
            0% {
                transform: translate(0, 0) rotate(-45deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translate(-500px, 500px) rotate(-45deg);
                opacity: 0;
            }
        }

        /* HEADER */

        .banner-title {
            font-size: 4rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow:
                0 0 25px rgba(168, 85, 247, 0.9),
                0 0 50px rgba(192, 132, 252, 0.5);
            letter-spacing: 6px;
        }

        .tagline {
            color: #d8b4fe;
            font-size: 0.9rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 45px;
            opacity: 0.85;
        }

        /* MAIN CONTAINER */

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(13, 6, 29, 0.85);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.85),
                inset 0 0 25px rgba(168, 85, 247, 0.15);
            backdrop-filter: blur(16px);
        }

        /* SEARCH */

        input {
            width: 92%;
            padding: 16px;
            margin-bottom: 25px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.5);
            background: rgba(7, 3, 15, 0.95);
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.35);
        }

        /* ITEMS */

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .item-card {
            background: rgba(30, 16, 61, 0.65);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 18px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            transition: 0.25s ease;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: rgba(192, 132, 252, 0.7);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.25);
        }

        /* MINECRAFT IMAGE */

        .item-image {
            width: 96px;
            height: 96px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px auto;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 8px rgba(192,132,252,0.3));
        }

        .item-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
        }

        .item-namespace {
            font-size: 0.75rem;
            color: #c084fc;
            opacity: 0.75;
            display: block;
            margin-top: 5px;
            margin-bottom: 15px;
            text-align: center;
            word-break: break-all;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 1.1rem;
        }

        .worth-value {
            color: #4ade80;
            font-weight: 800;
        }

        /* ADMIN */

        .admin-trigger {
            margin-top: 40px;
            color: #a78bfa;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: underline;
            opacity: 0.5;
        }

        .admin-trigger:hover {
            opacity: 1;
        }

        .admin-panel {
            display: none;
            margin-top: 30px;
            padding: 25px;
            background: rgba(7, 3, 15, 0.85);
            border-radius: 14px;
            border: 1px dashed rgba(168, 85, 247, 0.5);
            text-align: left;
        }

        .admin-panel h3 {
            color: #c084fc;
            margin-top: 0;
        }

        .admin-panel label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-weight: 600;
        }

        .admin-panel input {
            width: 100%;
        }

        .admin-btn {
            background: #a855f7;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .admin-btn:hover {
            background: #c084fc;
        }

        .delete-btn {
            background: #ef4444;
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        .delete-btn:hover {
            background: #f87171;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 12px;
            }

            .banner-title {
                font-size: 2.7rem;
            }

            .container {
                padding: 25px 18px;
            }

            .market-grid {
                grid-template-columns: 1fr;
            }

            .language-wrapper {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>

<body>

    <!-- LANGUAGE MENU -->

    <div class="language-wrapper">

        <button class="language-button" onclick="toggleLanguages()">
            🌐 <span id="current-language">English</span>
        </button>

        <div class="language-menu" id="language-menu">

            <button onclick="setLanguage('en')">
                🇬🇧 English
            </button>

            <button onclick="setLanguage('ro')">
                🇷🇴 Română
            </button>

            <button onclick="setLanguage('es')">
                🇪🇸 Español
            </button>

            <button onclick="setLanguage('fr')">
                🇫🇷 Français
            </button>

            <button onclick="setLanguage('de')">
                🇩🇪 Deutsch
            </button>

        </div>

    </div>

    <!-- METEORS -->

    <div class="sky-meteor m1"></div>
    <div class="sky-meteor m2"></div>
    <div class="sky-meteor m3"></div>

    <!-- HEADER -->

    <div class="banner-title">LUNARIA</div>

    <div class="tagline" id="tagline">
        ✦ Build • Explore • Connect ✦
    </div>

    <!-- MAIN -->

    <div class="container">

        <input
            type="text"
            id="search"
            placeholder="Search item registry (e.g., Diamond)..."
            oninput="fetchPrices()"
        >

        <div class="market-grid" id="market-grid"></div>

        <!-- ADMIN BUTTON -->

        <button
            class="admin-trigger"
            onclick="toggleAdminPanel()"
            id="admin-trigger"
        >
            ⚙️ Access Admin Price Management
        </button>

        <!-- ADMIN PANEL -->

        <div class="admin-panel" id="admin-panel">

            <h3 id="admin-title">
                Update / Add Server Items
            </h3>

            <label id="item-id-label">
                Item Namespace ID:
            </label>

            <input
                type="text"
                id="admin-item-id"
                placeholder="e.g. minecraft:diamond"
            >

            <label id="item-name-label">
                Display Name:
            </label>

            <input
                type="text"
                id="admin-item-name"
                placeholder="e.g. Diamond"
            >

            <label id="sell-label">
                Worth Price:
            </label>

            <input
                type="number"
                id="admin-sell"
                placeholder="e.g. 150"
                step="0.01"
            >

            <label id="password-label">
                Secret Admin Password:
            </label>

            <input
                type="password"
                id="admin-pass"
                placeholder="Enter password..."
            >

            <button
                class="admin-btn"
                onclick="submitPriceUpdate()"
                id="update-button"
            >
                Apply Changes
            </button>

            <button
                class="delete-btn"
                onclick="submitPriceDelete()"
                id="delete-button"
            >
                🗑️ Delete Item
            </button>

        </div>

    </div>

    <script>

        const API_URL = "https://lunaria-prices.onrender.com";

        /* =========================
           LANGUAGE SYSTEM
        ========================= */

        const translations = {

            en: {
                name: "English",
                tagline: "✦ Build • Explore • Connect ✦",
                search: "Search item registry (e.g., Diamond)...",
                noItems: "No items found.",
                connection: "Unable to connect to the economy API.",
                worth: "Worth:",
                admin: "⚙️ Access Admin Price Management",
                adminTitle: "Update / Add Server Items",
                itemId: "Item Namespace ID:",
                itemName: "Display Name:",
                worthPrice: "Worth Price:",
                password: "Secret Admin Password:",
                passwordPlaceholder: "Enter password...",
                update: "Apply Changes",
                delete: "🗑️ Delete Item",
                fill: "Please fill out all fields correctly!",
                deleteConfirm: "Are you absolutely sure you want to delete",
                updateError: "Error sending update.",
                deleteError: "Error running deletion."
            },

            ro: {
                name: "Română",
                tagline: "✦ Construiește • Explorează • Conectează-te ✦",
                search: "Caută un item (ex. Diamond)...",
                noItems: "Nu au fost găsite iteme.",
                connection: "Nu se poate conecta la API-ul economiei.",
                worth: "Valoare:",
                admin: "⚙️ Accesează gestionarea prețurilor",
                adminTitle: "Adaugă / Modifică iteme",
                itemId: "ID Namespace al itemului:",
                itemName: "Numele afișat:",
                worthPrice: "Prețul de valoare:",
                password: "Parola secretă de Admin:",
                passwordPlaceholder: "Introdu parola...",
                update: "Aplică modificările",
                delete: "🗑️ Șterge itemul",
                fill: "Completează toate câmpurile corect!",
                deleteConfirm: "Ești absolut sigur că vrei să ștergi",
                updateError: "Eroare la trimiterea modificării.",
                deleteError: "Eroare la ștergerea itemului."
            },

            es: {
                name: "Español",
                tagline: "✦ Construye • Explora • Conecta ✦",
                search: "Buscar objeto (ej. Diamond)...",
                noItems: "No se encontraron objetos.",
                connection: "No se puede conectar con la API.",
                worth: "Valor:",
                admin: "⚙️ Gestión de precios",
                adminTitle: "Añadir / Modificar objetos",
                itemId: "ID Namespace:",
                itemName: "Nombre:",
                worthPrice: "Precio de valor:",
                password: "Contraseña de administrador:",
                passwordPlaceholder: "Introduce la contraseña...",
                update: "Aplicar cambios",
                delete: "🗑️ Eliminar objeto",
                fill: "¡Completa todos los campos correctamente!",
                deleteConfirm: "¿Seguro que quieres eliminar",
                updateError: "Error al enviar la actualización.",
                deleteError: "Error al eliminar."
            },

            fr: {
                name: "Français",
                tagline: "✦ Construire • Explorer • Connecter ✦",
                search: "Rechercher un objet (ex. Diamond)...",
                noItems: "Aucun objet trouvé.",
                connection: "Impossible de se connecter à l'API.",
                worth: "Valeur :",
                admin: "⚙️ Gestion des prix",
                adminTitle: "Ajouter / Modifier des objets",
                itemId: "ID Namespace :",
                itemName: "Nom affiché :",
                worthPrice: "Prix de valeur :",
                password: "Mot de passe administrateur :",
                passwordPlaceholder: "Entrez le mot de passe...",
                update: "Appliquer les changements",
                delete: "🗑️ Supprimer l'objet",
                fill: "Veuillez remplir correctement tous les champs !",
                deleteConfirm: "Êtes-vous sûr de vouloir supprimer",
                updateError: "Erreur lors de la mise à jour.",
                deleteError: "Erreur lors de la suppression."
            },

            de: {
                name: "Deutsch",
                tagline: "✦ Bauen • Erkunden • Verbinden ✦",
                search: "Item suchen (z.B. Diamond)...",
                noItems: "Keine Items gefunden.",
                connection: "Verbindung zur Economy-API fehlgeschlagen.",
                worth: "Wert:",
                admin: "⚙️ Preisverwaltung",
                adminTitle: "Items hinzufügen / bearbeiten",
                itemId: "Item Namespace ID:",
                itemName: "Anzeigename:",
                worthPrice: "Wertpreis:",
                password: "Admin-Passwort:",
                passwordPlaceholder: "Passwort eingeben...",
                update: "Änderungen anwenden",
                delete: "🗑️ Item löschen",
                fill: "Bitte fülle alle Felder korrekt aus!",
                deleteConfirm: "Möchtest du wirklich löschen",
                updateError: "Fehler beim Aktualisieren.",
                deleteError: "Fehler beim Löschen."
            }

        };

        let currentLanguage =
            localStorage.getItem("lunariaLanguage") || "en";

        function toggleLanguages() {

            const menu =
                document.getElementById("language-menu");

            menu.style.display =
                menu.style.display === "block"
                    ? "none"
                    : "block";
        }

        function setLanguage(language) {

            if (!translations[language]) return;

            currentLanguage = language;

            localStorage.setItem(
                "lunariaLanguage",
                language
            );

            applyLanguage();

            document.getElementById(
                "language-menu"
            ).style.display = "none";

            fetchPrices();
        }

        function applyLanguage() {

            const t =
                translations[currentLanguage];

            document.getElementById(
                "current-language"
            ).textContent = t.name;

            document.getElementById(
                "tagline"
            ).textContent = t.tagline;

            document.getElementById(
                "search"
            ).placeholder = t.search;

            document.getElementById(
                "admin-trigger"
            ).textContent = t.admin;

            document.getElementById(
                "admin-title"
            ).textContent = t.adminTitle;

            document.getElementById(
                "item-id-label"
            ).textContent = t.itemId;

            document.getElementById(
                "item-name-label"
            ).textContent = t.itemName;

            document.getElementById(
                "sell-label"
            ).textContent = t.worthPrice;

            document.getElementById(
                "password-label"
            ).textContent = t.password;

            document.getElementById(
                "admin-pass"
            ).placeholder = t.passwordPlaceholder;

            document.getElementById(
                "update-button"
            ).textContent = t.update;

            document.getElementById(
                "delete-button"
            ).textContent = t.delete;

            document.documentElement.lang =
                currentLanguage;
        }

        /* =========================
           IMAGE SYSTEM
        ========================= */

        function getMinecraftImage(itemId) {

            /*
             * Uses the Minecraft Wiki/Smithed-style
             * item texture path.
             */

            const cleanId =
                itemId
                    .replace("minecraft:", "")
                    .trim();

            return `https://minecraft.wiki/images/InvIcon_${cleanId}.png`;
        }

        /* =========================
           RENDER ITEMS
        ========================= */

        function renderCards(items) {

            const grid =
                document.getElementById(
                    "market-grid"
                );

            grid.innerHTML = "";

            const t =
                translations[currentLanguage];

            if (!Array.isArray(items) ||
                items.length === 0) {

                grid.innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 30px;
                        color: #c084fc;
                    ">
                        ${t.noItems}
                    </div>
                `;

                return;
            }

            items.forEach(function(item) {

                const card =
                    document.createElement("div");

                card.className =
                    "item-card";

                /* IMAGE */

                const image =
                    document.createElement("img");

                image.className =
                    "item-image";

                image.src =
                    getMinecraftImage(
                        item.item_id
                    );

                image.alt =
                    item.item_name;

                /*
                 * If the image cannot be found,
                 * hide the broken image icon.
                 */

                image.onerror = function() {
                    this.style.display = "none";
                };

                /* NAME */

                const itemName =
                    document.createElement("div");

                itemName.className =
                    "item-name";

                itemName.textContent =
                    item.item_name ||
                    "Unknown Item";

                /* ID */

                const namespace =
                    document.createElement("span");

                namespace.className =
                    "item-namespace";

                namespace.textContent =
                    item.item_id ||
                    "Unknown ID";

                /* WORTH */

                const worthRow =
                    document.createElement("div");

                worthRow.className =
                    "price-row";

                worthRow.innerHTML = `
                    <span>${t.worth}</span>

                    <span class="worth-value">
                        $${Number(
                            item.sell_price || 0
                        ).toFixed(2)}
                    </span>
                `;

                card.appendChild(image);
                card.appendChild(itemName);
                card.appendChild(namespace);
                card.appendChild(worthRow);

                grid.appendChild(card);
            });
        }

        /* =========================
           FETCH PRICES
        ========================= */

        async function fetchPrices() {

            const query =
                document
                    .getElementById("search")
                    .value
                    .trim();

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices?search=" +
                        encodeURIComponent(query)
                    );

                if (!response.ok) {
                    throw new Error(
                        "API request failed"
                    );
                }

                const data =
                    await response.json();

                renderCards(data);

            } catch (err) {

                console.error(err);

                const t =
                    translations[currentLanguage];

                document.getElementById(
                    "market-grid"
                ).innerHTML = `
                    <div style="
                        grid-column: 1 / -1;
                        padding: 30px;
                        color: #f87171;
                    ">
                        ${t.connection}
                    </div>
                `;
            }
        }

        /* =========================
           ADMIN PANEL
        ========================= */

        function toggleAdminPanel() {

            const panel =
                document.getElementById(
                    "admin-panel"
                );

            panel.style.display =
                panel.style.display === "block"
                    ? "none"
                    : "block";
        }

        /* =========================
           UPDATE ITEM
        ========================= */

        async function submitPriceUpdate() {

            const item_id =
                document
                    .getElementById("admin-item-id")
                    .value
                    .trim();

            const item_name =
                document
                    .getElementById("admin-item-name")
                    .value
                    .trim();

            const sell_price =
                parseFloat(
                    document
                        .getElementById("admin-sell")
                        .value
                );

            const password =
                document
                    .getElementById("admin-pass")
                    .value;

            const t =
                translations[currentLanguage];

            if (
                !item_id ||
                isNaN(sell_price) ||
                !password
            ) {

                alert(t.fill);

                return;
            }

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices/update",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                item_id,
                                item_name,
                                sell_price,
                                password
                            })
                        }
                    );

                const result =
                    await response.json();

                alert(
                    result.message ||
                    "Done!"
                );

                fetchPrices();

            } catch (err) {

                console.error(err);

                alert(t.updateError);
            }
        }

        /* =========================
           DELETE ITEM
        ========================= */

        async function submitPriceDelete() {

            const item_id =
                document
                    .getElementById("admin-item-id")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("admin-pass")
                    .value;

            const t =
                translations[currentLanguage];

            if (!item_id || !password) {

                alert(
                    t.itemId +
                    " + " +
                    t.password
                );

                return;
            }

            if (
                !confirm(
                    `${t.deleteConfirm} ${item_id}?`
                )
            ) {
                return;
            }

            try {

                const response =
                    await fetch(
                        API_URL +
                        "/api/prices/delete",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                item_id,
                                password
                            })
                        }
                    );

                const result =
                    await response.json();

                alert(
                    result.message ||
                    "Done!"
                );

                fetchPrices();

            } catch (err) {

                console.error(err);

                alert(t.deleteError);
            }
        }

        /* START */

        applyLanguage();
        fetchPrices();

    </script>

</body>
</html>
