<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunaria SMP - Economy Hub</title>
    <style>
        /* 🌌 Deep Magical Night Sky Base Background Layering */
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: radial-gradient(circle at 50% 25%, #251254 0%, #0d0624 55%, #050212 100%);
            color: #f1edfa; 
            text-align: center; 
            padding: 60px 20px; 
            margin: 0;
            min-height: 100vh;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* 🌙 Background Star Layer Canvas */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }

        /* ✨ Sharp Four-Pointed Sparkle Stars (Matches the Banner!) */
        .sparkle-star {
            position: absolute;
            background: #ffffff;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            /* Intense layered drop-shadow filters build a clean neon purple glare core */
            filter: drop-shadow(0 0 4px #ffffff) drop-shadow(0 0 10px #b066ff) drop-shadow(0 0 20px #9333ea);
            animation: pulseTwinkle var(--duration) infinite ease-in-out;
        }

        /* Draws the wide horizontal beams */
        .sparkle-star::before {
            content: '';
            position: absolute;
            background: linear-gradient(to right, transparent, #ffffff, transparent);
            width: var(--star-size);
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Draws the tall vertical beams */
        .sparkle-star::after {
            content: '';
            position: absolute;
            background: linear-gradient(to bottom, transparent, #ffffff, transparent);
            width: 2px;
            height: var(--star-size);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes pulseTwinkle {
            0%, 100% { transform: scale(0.3); opacity: 0.15; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* 🌠 Smooth, Graceful Drifting Passing Star Clusters */
        .shooting-star {
            position: fixed;
            top: var(--start-y);
            left: var(--start-x);
            height: 2px;
            background: linear-gradient(-45deg, #ffffff, #c084fc, rgba(0, 0, 0, 0));
            filter: drop-shadow(0 0 6px #c084fc);
            animation: slowShoot var(--duration) ease-in-out forwards;
            z-index: -1;
        }

        @keyframes slowShoot {
            0% { width: 0; transform: rotate(-45deg); opacity: 0; }
            15% { width: 90px; opacity: 1; }
            100% { width: 0; transform: translate(var(--travel-x), var(--travel-y)) rotate(-45deg); opacity: 0; }
        }

        /* ✨ Banner Branding Neon Header Elements */
        .banner-title {
            font-size: 4.2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 2px;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.9), 0 0 50px rgba(192, 132, 252, 0.6);
            letter-spacing: 7px;
        }
        .tagline {
            color: #d8b4fe;
            font-size: 0.95rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
            opacity: 0.85;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        /* 🏰 Floating High-Glass Window Container Dashboard */
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: rgba(13, 6, 29, 0.8); 
            padding: 40px; 
            border-radius: 26px; 
            border: 1px solid rgba(168, 85, 247, 0.45); 
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            animation: softFloating 6s ease-in-out infinite;
        }

        @keyframes softFloating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        input, select { 
            width: 92%; 
            padding: 16px; 
            margin-bottom: 30px; 
            border-radius: 12px; 
            border: 1px solid rgba(168, 85, 247, 0.5); 
            background: rgba(7, 3, 15, 0.95); 
            color: #fff; 
            font-size: 16px; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        input:focus { border-color: #c084fc; outline: none; box-shadow: 0 0 20px rgba(168, 85, 247, 0.7); }

        /* Market Card Arrangement Setup */
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; margin-top: 10px; }
        
        /* High Quality Magic Item Profile Cards */
        .item-card {
            background: rgba(28, 14, 59, 0.65);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 18px;
            padding: 24px;
            text-align: left;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(168, 85, 247, 0.9);
            background: rgba(43, 21, 92, 0.75);
            box-shadow: 0 12px 35px rgba(168, 85, 247, 0.5);
        }

        .item-name { font-size: 1.35rem; font-weight: bold; color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .item-namespace { font-size: 0.8rem; color: #c084fc; opacity: 0.8; display: block; margin-bottom: 15px; }
        .price-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 1.05rem; }
        .buy-value { color: #4ade80; font-weight: 700; text-shadow: 0 0 10px rgba(74, 222, 128, 0.4); }
        .sell-value { color: #f87171; font-weight: 700; text-shadow: 0 0 10px rgba(248, 113, 113, 0.4); }
        
        .admin-trigger { margin-top: 40px; color: #a78bfa; background: none; border: none; cursor: pointer; font-size: 0.95rem; text-decoration: underline; opacity: 0.5; }
        .admin-trigger:hover { opacity: 1; }
        .admin-panel { display: none; margin-top: 30px; padding: 25px; background: rgba(7, 3, 15, 0.85); border-radius: 14px; border: 1px dashed rgba(168, 85, 247, 0.5); text-align: left; }
        .admin-btn { background: #a855f7; border: none; color: white; padding: 14px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; font-size: 1rem; }
        .admin-btn:hover { background: #c084fc; box-shadow: 0 0 20px #a855f7; }
    </style>
</head>
<body>

    <!-- Target injection canvas backdrop -->
    <div id="stars-container"></div>

    <div class="banner-title">LUNARIA</div>
    <div class="tagline">✦ Build • Explore • Connect ✦</div>
    
    <div class="container">
        <input type="text" id="search" placeholder="Search item registry (e.g., Diamond)..." oninput="fetchPrices()">
        
        <div class="market-grid" id="market-grid"></div>

        <button class="admin-trigger" onclick="toggleAdminPanel()">⚙️ Access Admin Price Management</button>
        
        <div class="admin-panel" id="admin-panel">
            <h3 style="color: #c084fc; margin-top: 0;">Update Server Item Prices</h3>
            <label>Select Item Namespace ID:</label>
            <select id="admin-item-id">
                <option value="minecraft:diamond">minecraft:diamond (Diamond)</option>
                <option value="minecraft:iron_ingot">minecraft:iron_ingot (Iron Ingot)</option>
                <option value="minecraft:netherite_ingot">minecraft:netherite_ingot (Netherite Ingot)</option>
            </select>

            <label>New Buy Price ($):</label>
            <input type="number" id="admin-buy" placeholder="e.g. 550">

            <label>New Sell Price ($):</label>
            <input type="number" id="admin-sell" placeholder="e.g. 175">

            <label>Secret Admin Password:</label>
            <input type="password" id="admin-pass" placeholder="Enter password...">

            <button class="admin-btn" onclick="submitPriceUpdate()">Apply Price Update</button>
        </div>
    </div>

<script>
    let currentData = [];
    const API_URL = "https://onrender.com"; 

    // Generate Dynamic Cross Flares Sparkle Node arrays
    function generatePremiumSky() {
        const container = document.getElementById('stars-container');
        if(!container) return;
        const totalStars = 75; 

        for (let i = 0; i < totalStars; i++) {
            const star = document.createElement('div');
            star.classList.add('sparkle-star');
            
            const starSize = Math.random() * 22 + 12; // Controls cross beam length directly
            star.style.top = (Math.random() * 100) + '%';
            star.style.left = (Math.random() * 100) + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2.5) + 's');
            star.style.setProperty('--star-size', starSize + 'px');
            
            container.appendChild(star);
        }
    }

    // Spawn passing groups from corners
    function spawnDriftingStar() {
        const star = document.createElement('div');
        star.classList.add('shooting-star');

        const startX = Math.random() * window.innerWidth;
        const startY = Math.random() * (window.innerHeight / 3); 
        const duration = Math.random() * 2 + 3.5; 

        star.style.setProperty('--start-x', startX + 'px');
        star.style.setProperty('--start-y', startY + 'px');
